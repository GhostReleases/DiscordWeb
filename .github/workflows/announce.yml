name: Check for changes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Run change checker
        env:
          WEBHOOK_RELEASES: ${{ secrets.WEBHOOK_RELEASES }}
          WEBHOOK_UPDATES: ${{ secrets.WEBHOOK_UPDATES }}
          WEBHOOK_STATUS: ${{ secrets.WEBHOOK_STATUS }}
        run: node .github/scripts/check-changes.js

      - name: Commit and push state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "Update state.json"
          git push

name: Check for changes

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:        # manual trigger (for testing)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Run change checker
        env:
          WEBHOOK_RELEASES: ${{ secrets.WEBHOOK_RELEASES }}
          WEBHOOK_STATUS: ${{ secrets.WEBHOOK_STATUS }}
        run: node .github/scripts/check-changes.js

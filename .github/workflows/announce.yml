name: Check for new releases/updates

on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours
  workflow_dispatch:        # allows manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch and compare
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Fetch the script.js from your website (or from the repo)
          curl -o script.js https://ghostreleases.com/script.js
          # We'll use a Node script to parse and compare
          node .github/scripts/check-releases.js
